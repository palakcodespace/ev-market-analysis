{% extends "base.html" %}

{% block title %}500 - Server Error{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="p-5 ev-card mx-auto" style="max-width: 600px;">
        <i class="bi bi-x-octagon-fill display-1 text-danger mb-3 d-block"></i>
        <h2 class="fw-bold text-navy mb-2">500 - Internal Server Error</h2>
        <p class="text-muted mb-4">
            An internal server error occurred while processing the database query.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-ev-teal px-4">
            <i class="bi bi-house-door me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
