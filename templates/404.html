{% extends "base.html" %}

{% block title %}404 - Page Not Found{% endblock %}

{% block content %}
<div class="container py-5 text-center">
    <div class="p-5 ev-card mx-auto" style="max-width: 600px;">
        <i class="bi bi-exclamation-triangle display-1 text-warning mb-3 d-block"></i>
        <h2 class="fw-bold text-navy mb-2">404 - Page Not Found</h2>
        <p class="text-muted mb-4">
            The requested electric vehicle analytics route or resource does not exist on this server.
        </p>
        <a href="{{ url_for('dashboard') }}" class="btn btn-ev-teal px-4">
            <i class="bi bi-house-door me-2"></i> Return to Dashboard
        </a>
    </div>
</div>
{% endblock %}
